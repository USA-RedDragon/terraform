name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  drift:
    name: Terraform Drift Detection
    uses: USA-RedDragon/terraform-workflow/.github/workflows/terraform.yaml@df9ce19d159b365f54283ccab6f81fb0f72ae940 # v1.1.0
    permissions:
      id-token: write # Required for AWS auth
      contents: read  # Required for actions/checkout
      issues: write   # Required for drift issues
    with:
      working-directory: infra
      drift-detection: true
      aws-auth: true
      aws-region: us-east-1
    secrets:
      aws-role-to-assume: arn:aws:iam::803205869942:role/mcswain-terraform
      aws-role-session-name: mcswain-terraform
      secrets: |
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
